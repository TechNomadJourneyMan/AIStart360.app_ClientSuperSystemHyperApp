<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AIStart360</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem calc(1.5rem + env(safe-area-inset-left)) 2rem calc(1.5rem + env(safe-area-inset-right));
      background: #0A0B0F;
      color: #E8EDE9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 22rem; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1.5rem; opacity: .9; }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 .5rem; letter-spacing: -.01em; }
    p { margin: 0; font-size: .92rem; line-height: 1.55; color: #8A9691; }
    button {
      margin-top: 1.75rem;
      width: 100%;
      padding: .85rem 1.25rem;
      font: inherit;
      font-weight: 600;
      color: #06120C;
      background: #6EE7A8;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:active { opacity: .85; }
    button:focus-visible { outline: 2px solid #6EE7A8; outline-offset: 3px; }
    .status { margin-top: 1rem; font-size: .8rem; color: #6E7C7B; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 14.6 9.4 22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z" fill="#6EE7A8" opacity=".85"/>
    </svg>
    <h1>Нет подключения</h1>
    <p>Кабинет AIStart360 работает онлайн. Проверьте интернет и попробуйте снова.</p>
    <button type="button" id="retry">Повторить</button>
    <div class="status" id="status" role="status"></div>
  </div>

  <script>
    // The shell normally loads the hosted portal; this file only renders when
    // that navigation fails, so "retry" means "try the portal again".
    var PORTAL = 'https://aistart360.vercel.app'
    var status = document.getElementById('status')

    document.getElementById('retry').addEventListener('click', function () {
      status.textContent = 'Подключаемся…'
      location.replace(PORTAL)
    })

    window.addEventListener('online', function () {
      status.textContent = 'Соединение восстановлено'
      location.replace(PORTAL)
    })
  </script>
</body>
</html>
