[project]
name = "mark-backend"
version = "0.1.0"
description = "Mark Analytics — AI-native OSINT & Business Intelligence backend"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.6",

    # Auth (Supabase JWT verification)
    "pyjwt[crypto]>=2.9.0",
    "cryptography>=43.0.0",

    # Queue + cache + streams
    "arq>=0.26.0",
    "redis>=5.1.0",
    "sse-starlette>=2.1.0",
    "croniter>=2.0.7",

    # HTTP
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "aiolimiter>=1.1.0",

    # Storage
    "boto3>=1.35.0",            # S3 / R2 / MinIO
    "aiobotocore>=2.15.0",

    # AI providers
    "google-genai>=0.3.0",      # Google AI Studio Gemini

    # Embeddings (local CPU)
    "fastembed>=0.4.0",

    # Graph
    "neo4j>=5.25.0",

    # Crawling
    "scrapy>=2.11.2",
    "scrapy-playwright>=0.0.41",
    "playwright>=1.47.0",
    "crawlee[playwright]>=0.4.0",
    "trafilatura>=1.12.0",
    "lxml>=5.3.0",
    "selectolax>=0.3.25",
    "feedparser>=6.0.10",

    # Utils
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "ulid-py>=1.1.0",
    "python-slugify>=8.0.0",
    "orjson>=3.10.0",
    "tldextract>=5.1.0",
    "phonenumbers>=8.13.0",
    "rapidfuzz>=3.10.0",
    "jsonschema>=4.23.0",

    # Observability
    "sentry-sdk[fastapi]>=2.17.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use realistic Russian/Kazakh fixtures (ТОО, etc.) which trip the
# ambiguous-unicode lint. Suppress for tests only.
"tests/*" = ["S", "RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["app/db/migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit real external APIs (skip in CI)",
    "integration: tests requiring Postgres/Redis (use docker-compose)",
]
