name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d mark"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mark
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@localhost:5432/mark
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_JWT_SECRET: test-secret
      SECRET_KEY: test
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend

      - name: Format check
        run: ruff format --check backend

      - name: Typecheck
        run: mypy backend/app
        continue-on-error: true   # phase-1: type-check is informational

      - name: Test (unit only)
        run: pytest backend -q -m "not integration and not live"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t mark-api:ci backend
      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t mark-worker:ci backend
