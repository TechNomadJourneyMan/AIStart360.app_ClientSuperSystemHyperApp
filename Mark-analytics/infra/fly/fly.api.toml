app = "mark-api"
primary_region = "fra"

[build]
dockerfile = "../docker/Dockerfile.api"

[env]
APP_ENV = "production"
PORT = "8000"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
