name: mark

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mark-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mark"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [mark]

  redis:
    image: redis:7-alpine
    container_name: mark-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mark]

  minio:
    image: minio/minio:latest
    container_name: mark-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [mark]

  minio-init:
    image: minio/mc:latest
    container_name: mark-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mark-raw || true &&
      mc anonymous set download local/mark-raw || true;
      "
    networks: [mark]

  # Uncomment to run API + worker in compose instead of host:
  # api:
  #   build:
  #     context: ../../backend
  #     dockerfile: ../infra/docker/Dockerfile.api
  #   env_file: ../../backend/.env
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mark
  #     REDIS_URL: redis://redis:6379/0
  #     R2_ENDPOINT_URL: http://minio:9000
  #   ports: ["8000:8000"]
  #   depends_on:
  #     postgres: {condition: service_healthy}
  #     redis: {condition: service_healthy}
  #     minio: {condition: service_healthy}
  #   networks: [mark]
  #
  # worker:
  #   build:
  #     context: ../../backend
  #     dockerfile: ../infra/docker/Dockerfile.worker
  #   env_file: ../../backend/.env
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/mark
  #     REDIS_URL: redis://redis:6379/0
  #     R2_ENDPOINT_URL: http://minio:9000
  #   depends_on:
  #     postgres: {condition: service_healthy}
  #     redis: {condition: service_healthy}
  #   networks: [mark]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  mark:
    driver: bridge
