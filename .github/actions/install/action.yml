name: Install dependencies
description: >-
  Node 22 and the root node_modules. node_modules is restored from the cache keyed on the exact Node
  version, package-lock.json and the Prisma schema (postinstall runs `prisma generate` into
  node_modules); on a miss `npm ci` installs it. Only the job with `save: 'true'` writes the cache
  back, so the parallel jobs do not race to save the same key.
inputs:
  save:
    description: Save node_modules to the cache after a miss ('true' in one job only).
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      id: node
      with:
        node-version: 22
        # ~/.npm: on a node_modules miss npm ci takes the packages from here instead of the registry.
        cache: npm
    - name: Restore node_modules
      uses: actions/cache/restore@v4
      id: modules
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
    - name: npm ci (no cached node_modules for this lockfile)
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - name: Save node_modules
      if: steps.modules.outputs.cache-hit != 'true' && inputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
