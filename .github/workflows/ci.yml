name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · tests (with prod-mirror DB)
    runs-on: ubuntu-latest
    # +15 min for `next build` (R-019).
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
      DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix services/whatsapp-web-bridge ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build the prod-mirror test database (Prisma + supabase/migrations)
        run: node scripts/test-db/setup.mjs
      - name: Unit + DB integration tests (real RLS)
        run: npx vitest run
      # R-019: tsc and vitest do not catch what only the bundler sees — e.g. a client component
      # importing node:crypto, a server-only module pulled into the browser bundle, a broken
      # next.config. Build exactly like Railway does (`npm run build`), with dummy public env:
      # no secrets in CI. The Supabase URL is a closed loopback port, so any build-time fetch fails
      # fast instead of hanging on DNS. `--no-lint`: lint already ran above.
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build (next build)
        run: npm run build -- --no-lint
        env:
          NODE_ENV: production
          # The build script gives the main process 6 GB; webpack workers inherit this. A private-repo
          # ubuntu-latest runner has ~7 GB RAM, so the workers are capped lower.
          NODE_OPTIONS: --max-old-space-size=3072
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-dummy-service-role-key
          NEXT_PUBLIC_MARKET_APP_URL: https://market.ci.invalid
          NEXT_PUBLIC_APP_URL: https://portal.ci.invalid
