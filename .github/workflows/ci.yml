name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

# Three independent jobs run in parallel — static checks, tests against the prod-mirror database,
# the production build — so the run takes as long as the longest of them (the build), not their sum
# (one sequential job took ~10.5 min until 2026-11-17). node_modules comes from the cache
# (.github/actions/install). The last job keeps the old name «typecheck · lint · tests (with
# prod-mirror DB)»: scripts/deploy/preflight.mjs requires that check run with conclusion `success`
# on the commit it deploys, and it succeeds only when all three jobs did.
jobs:
  static:
    name: tsc · lint · migration numbers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # R4-A4 (R-019): no new migration number twice (the 15 old repeats are listed by file name),
      # every migration from 140 has rollback/<name>.down.sql. Reads only the folder; runs first, no deps.
      - name: Migration numbers and rollbacks
        run: node scripts/deploy/check-migrations.mjs
      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          save: 'true'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  tests:
    name: tests (prod-mirror DB, real RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
      DIRECT_URL: postgres://postgres:postgres@127.0.0.1:5432/aistart360_test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install
      # The WhatsApp bridge has its own package.json; its end-to-end tests start server.mjs.
      - name: Install the WhatsApp bridge dependencies
        run: npm --prefix services/whatsapp-web-bridge ci
      - name: Build the prod-mirror test database (Prisma + supabase/migrations)
        run: node scripts/test-db/setup.mjs
      - name: Unit + DB integration tests (real RLS)
        run: npx vitest run

  # R-019: tsc and vitest do not catch what only the bundler sees — e.g. a client component
  # importing node:crypto, a server-only module pulled into the browser bundle, a broken
  # next.config — nor Next's own checks of the route and page exports (.next/types). Build exactly
  # like Railway does (`npm run build`), with dummy public env: no secrets in CI. The Supabase URL is
  # a closed loopback port, so any build-time fetch fails fast instead of hanging on DNS.
  # `--no-lint`: the static job lints.
  build:
    name: production build (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/install
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build (next build)
        run: npm run build -- --no-lint
        env:
          NODE_ENV: production
          # The build script gives the main process 6 GB; webpack workers inherit this, so they are
          # capped lower to leave the runner room for several of them.
          NODE_OPTIONS: --max-old-space-size=3072
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-build-dummy-service-role-key
          NEXT_PUBLIC_MARKET_APP_URL: https://market.ci.invalid
          NEXT_PUBLIC_APP_URL: https://portal.ci.invalid

  # The check preflight requires (CI_CHECK_PREFIX). `always()`: it also runs — and fails — when a
  # job above failed or was cancelled, instead of being skipped (a skipped required check is not a pass).
  checks:
    name: typecheck · lint · tests (with prod-mirror DB)
    if: always()
    needs: [static, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Static checks, tests and build all succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
